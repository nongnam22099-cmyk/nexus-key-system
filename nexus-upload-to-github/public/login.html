<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Hub - Admin Login</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border: rgba(0, 229, 255, 0.2);
      --primary: #00e5ff;
      --primary-hover: #00b4d8;
      --accent: #7928ca;
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --danger: #ff4757;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 20%, #161e38 0%, var(--bg) 70%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 229, 255, 0.15);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .logo-container {
      margin-bottom: 24px;
    }
    .logo-badge {
      display: inline-block;
      padding: 6px 14px;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.2), rgba(121, 40, 202, 0.2));
      border: 1px solid var(--primary);
      border-radius: 20px;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 12px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00e5ff 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .input-wrapper {
      position: relative;
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 14, 23, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: all 0.2s ease;
      outline: none;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }
    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      border: none;
      border-radius: 10px;
      color: #0b0f19;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
      margin-top: 8px;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.5);
    }
    .btn-login:active {
      transform: translateY(0);
    }
    .error-msg {
      display: none;
      background: rgba(255, 71, 87, 0.15);
      border: 1px solid var(--danger);
      color: #ff6b81;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      text-align: left;
    }
    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo-container">
      <div class="logo-badge">Key System Server</div>
      <h1>NEXUS HUB</h1>
      <p class="subtitle">ระบบจัดการคีย์ & License Dashboard</p>
    </div>

    <div id="errorBox" class="error-msg"></div>

    <form id="loginForm">
      <div class="input-group">
        <label for="password">รหัสผ่านแอดมิน (Admin Password)</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="ใส่รหัสผ่าน..." required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">เข้าสู่ระบบ (Login)</button>
    </form>

    <div class="footer-note">
      รหัสผ่านเริ่มต้นคือ: <strong style="color: var(--primary);">admin</strong>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('nexus_admin_token');
    if (token) {
      // Check if current token is valid
      fetch('/api/auth/check', {
        headers: { 'Authorization': `Bearer ${token}` }
      }).then(res => res.json()).then(data => {
        if (data.success) {
          window.location.href = '/dashboard';
        } else {
          localStorage.removeItem('nexus_admin_token');
        }
      }).catch(() => {});
    }

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.innerText = 'กำลังเข้าสู่ระบบ...';

      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await res.json();
        if (data.success && data.token) {
          localStorage.setItem('nexus_admin_token', data.token);
          window.location.href = '/dashboard';
        } else {
          errorBox.innerText = data.message || 'รหัสผ่านไม่ถูกต้อง';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.innerText = 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้';
        errorBox.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerText = 'เข้าสู่ระบบ (Login)';
      }
    });
  </script>
</body>
</html>
